<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boat Dummy Page</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(#87ceeb 0 60%, #1e90ff 60% 100%);
    }
    .card {
      text-align: center;
      background: rgba(255,255,255,0.85);
      color: #0b2a3d;
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      max-width: 520px;
    }
    .boat {
      font-size: 5rem;
      line-height: 1;
      margin: .5rem 0 1rem;
      animation: bob 2s ease-in-out infinite;
      display: inline-block;
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Welcome Aboard!</h1>
    <div class="boat" aria-hidden="true">⛵</div>
    <p>This is a dummy boat web page for layout and styling experiments.</p>
  </main>
</body>
</html>
